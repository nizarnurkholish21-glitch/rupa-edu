name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tes unit
        run: npm test
      - name: Tes isolasi peran (RLS) di PostgreSQL
        run: npm run test:db
      - name: Seed SQL sinkron dengan konten demo
        run: npm run seed:sql && git diff --exit-code supabase/seed.sql
      - name: Build produksi
        run: npm run build
      - name: Tidak ada rahasia di bundle klien
        run: npm run check:secrets
